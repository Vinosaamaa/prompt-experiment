<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROMPT LAB — Prompt Experiment</title>
  <meta name="description" content="PROMPT LAB — a public gallery of browser experiments. Games, toys, and weird interactive prompts." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23090b0d'/%3E%3Crect x='4' y='4' width='24' height='24' fill='%23c8f53b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #090b0d;
      --ink-2: #12151a;
      --paper: #f2f0e8;
      --mute: #8b9088;
      --acid: #c8f53b;
      --signal: #ff3b1f;
      --steel: #6ec8ff;
      --line: rgba(242, 240, 232, 0.12);
      --font-display: "Syne", "Arial Narrow", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-mono);
      min-height: 100vh;
      overflow-x: hidden;
      cursor: crosshair;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* ---------- atmosphere canvas ---------- */
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
      animation: grainShift 0.45s steps(2) infinite;
    }
    @keyframes grainShift {
      0% { transform: translate(0,0); }
      50% { transform: translate(-1%, 1%); }
      100% { transform: translate(1%, -1%); }
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(1200px, calc(100% - 2.5rem));
      margin: 0 auto;
    }

    /* ---------- top bar ---------- */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0 0;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .top a:hover { color: var(--acid); }
    .top-dot {
      width: 0.45rem; height: 0.45rem;
      border-radius: 50%;
      background: var(--acid);
      box-shadow: 0 0 12px var(--acid);
      display: inline-block;
      margin-right: 0.55rem;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.75); }
    }

    /* ---------- HERO: one composition ---------- */
    .hero {
      min-height: calc(100vh - 3rem);
      display: grid;
      align-content: center;
      padding: 4rem 0 5rem;
      position: relative;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3.6rem, 16vw, 10.5rem);
      line-height: 0.86;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      color: var(--paper);
      margin-bottom: 1.75rem;
      max-width: 12ch;
    }
    .brand .ch {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.55em) rotate(-4deg);
      animation: rise 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .brand .acid { color: var(--acid); }
    @keyframes rise {
      to { opacity: 1; transform: none; }
    }

    .hero-line {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.15rem, 2.6vw, 1.85rem);
      letter-spacing: -0.02em;
      max-width: 22ch;
      margin-bottom: 0.85rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.45s ease forwards;
    }
    .hero-sub {
      color: var(--mute);
      font-size: 0.92rem;
      line-height: 1.55;
      max-width: 38ch;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.6s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.95rem 1.35rem;
      background: var(--acid);
      color: var(--ink);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.8s 0.75s ease forwards;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px var(--ink), 0 0 28px rgba(200, 245, 59, 0.45);
    }
    .cta span.arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }
    .cta:hover span.arrow { transform: translateX(4px); }

    /* dominant hero visual plane — full-bleed signal field behind type */
    .hero-visual {
      position: absolute;
      right: -4%;
      top: 12%;
      width: min(52vw, 560px);
      aspect-ratio: 1;
      pointer-events: none;
      opacity: 0;
      animation: fadeUp 1.1s 0.35s ease forwards;
      z-index: -1;
    }
    .hero-visual .ring {
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(200, 245, 59, 0.35);
      border-radius: 50%;
      animation: spin 28s linear infinite;
    }
    .hero-visual .ring:nth-child(2) {
      inset: 18%;
      border-color: rgba(110, 200, 255, 0.25);
      animation-direction: reverse;
      animation-duration: 40s;
    }
    .hero-visual .core {
      position: absolute;
      inset: 30%;
      background:
        conic-gradient(from 40deg, transparent 0 20%, var(--acid) 0 22%, transparent 0 45%, var(--signal) 0 47%, transparent 0 70%, var(--steel) 0 72%, transparent 0);
      border-radius: 50%;
      filter: blur(0.5px);
      opacity: 0.55;
      animation: spin 16s linear infinite;
    }
    .hero-visual .slash {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 48%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--paper), transparent);
      transform: rotate(-18deg);
      opacity: 0.5;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      .hero-visual { width: 78vw; top: auto; bottom: 8%; right: -10%; opacity: 0.55; }
      .hero { padding-bottom: 8rem; }
    }

    /* ---------- experiments section ---------- */
    .exps {
      padding: 1rem 0 6rem;
      border-top: 1px solid var(--line);
    }
    .exps-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 1.5rem 0 1.25rem;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .exps-head strong { color: var(--paper); font-weight: 500; }

    .list { list-style: none; }

    .exp {
      display: grid;
      grid-template-columns: 4.5rem 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 1.35rem 0.35rem;
      border-top: 1px solid var(--line);
      position: relative;
      transition: background 0.25s ease, padding-left 0.25s ease;
    }
    .exp:last-child { border-bottom: 1px solid var(--line); }
    .exp::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--acid);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.25s ease;
    }
    .exp:hover,
    .exp:focus-within {
      background: rgba(200, 245, 59, 0.04);
      padding-left: 0.85rem;
    }
    .exp:hover::before,
    .exp:focus-within::before { transform: scaleY(1); }

    .exp-idx {
      font-size: 0.75rem;
      color: var(--mute);
    }
    .exp-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.35rem, 3.2vw, 2.15rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 0.35rem;
      transition: color 0.2s ease;
    }
    .exp:hover .exp-title { color: var(--acid); }
    .exp-tagline {
      color: var(--mute);
      font-size: 0.82rem;
      line-height: 1.45;
      max-width: 52ch;
    }
    .exp-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.7rem;
    }
    .tag {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.28rem 0.45rem;
      border: 1px solid var(--line);
      color: var(--mute);
    }
    .exp-go {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--acid);
      white-space: nowrap;
      opacity: 0.7;
      transition: opacity 0.2s, transform 0.2s;
    }
    .exp:hover .exp-go {
      opacity: 1;
      transform: translateX(4px);
    }

    @media (max-width: 640px) {
      .exp {
        grid-template-columns: 2.5rem 1fr;
        grid-template-rows: auto auto;
      }
      .exp-go {
        grid-column: 2;
        justify-self: start;
        margin-top: 0.35rem;
      }
    }

    /* ---------- footer ---------- */
    .foot {
      border-top: 1px solid var(--line);
      padding: 1.5rem 0 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      justify-content: space-between;
      color: var(--mute);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .foot a:hover { color: var(--paper); }

    /* cursor orb */
    #orb {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--acid);
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: exclusion;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
      opacity: 0;
    }
    body.has-pointer #orb { opacity: 0.9; }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div id="orb" aria-hidden="true"></div>

  <div class="shell">
    <header class="top">
      <div><span class="top-dot"></span>Live lab · Cloudflare Pages</div>
      <nav>
        <a href="#experiments">Experiments</a>
      </nav>
    </header>

    <section class="hero" aria-label="Intro">
      <div class="hero-visual" aria-hidden="true">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="core"></div>
        <div class="slash"></div>
      </div>

      <h1 class="brand" id="brand" aria-label="Prompt Lab">PROMPT LAB</h1>
      <p class="hero-line">Browser experiments, shipped in public.</p>
      <p class="hero-sub">A living gallery of prompt-built games and interactive toys. No install — open a link and play.</p>
      <a class="cta" href="#experiments">Enter the lab <span class="arrow" aria-hidden="true">→</span></a>
    </section>

    <section class="exps" id="experiments">
      <div class="exps-head">
        <div><strong>Index</strong> · all public builds</div>
        <div id="count">00</div>
      </div>
      <ul class="list" id="list"></ul>
    </section>

    <footer class="foot">
      <div>Prompt Experiment · auto-deploys from main</div>
      <div><a href="https://github.com/Vinosaamaa/prompt-experiment" target="_blank" rel="noopener">Source</a></div>
    </footer>
  </div>

  <script type="module">
    /* Brand letter stagger */
    const brand = document.getElementById('brand');
    const raw = brand.textContent;
    brand.textContent = '';
    [...raw].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ch' + (ch === ' ' ? '' : '');
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      if (i >= 7) s.classList.add('acid'); // "LAB" accent
      s.style.animationDelay = `${0.04 + i * 0.045}s`;
      brand.appendChild(s);
    });

    /* Load experiments */
    const list = document.getElementById('list');
    const count = document.getElementById('count');

    async function load() {
      let data = [];
      try {
        const res = await fetch('./experiments.json', { cache: 'no-store' });
        data = await res.json();
      } catch {
        data = [];
      }
      count.textContent = String(data.length).padStart(2, '0');
      list.innerHTML = data.map((e, i) => `
        <li>
          <a class="exp" href="${e.path}" data-magnetic>
            <div class="exp-idx">${String(i + 1).padStart(2, '0')}</div>
            <div>
              <div class="exp-title">${escapeHtml(e.title)}</div>
              <div class="exp-tagline">${escapeHtml(e.tagline)}</div>
              <div class="exp-meta">
                ${(e.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
                <span class="tag">${escapeHtml(e.status || 'live')}</span>
              </div>
            </div>
            <div class="exp-go">Open ↗</div>
          </a>
        </li>
      `).join('');
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    load();

    /* Cursor orb */
    const orb = document.getElementById('orb');
    window.addEventListener('pointermove', (e) => {
      document.body.classList.add('has-pointer');
      orb.style.left = e.clientX + 'px';
      orb.style.top = e.clientY + 'px';
    }, { passive: true });

    /* Atmosphere: drifting signal grid + sparks */
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');
    let w, h, dpr, t0 = performance.now();
    const sparks = Array.from({ length: 28 }, () => ({
      x: Math.random(), y: Math.random(),
      v: 0.02 + Math.random() * 0.08,
      r: 0.5 + Math.random() * 1.8,
    }));

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    function frame(now) {
      const t = (now - t0) / 1000;
      ctx.clearRect(0, 0, w, h);

      // vertical wash
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#090b0d');
      g.addColorStop(0.45, '#10141a');
      g.addColorStop(1, '#0a1210');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // perspective grid floor
      ctx.save();
      ctx.translate(w * 0.5, h * 0.78);
      ctx.strokeStyle = 'rgba(200,245,59,0.07)';
      ctx.lineWidth = 1;
      const drift = (t * 40) % 48;
      for (let i = -20; i <= 20; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 48, 0);
        ctx.lineTo(i * 90, h * 0.5);
        ctx.stroke();
      }
      for (let j = 0; j < 16; j++) {
        const y = j * 28 + drift;
        const s = y / (h * 0.5);
        ctx.beginPath();
        ctx.moveTo(-w * (0.2 + s), y);
        ctx.lineTo(w * (0.2 + s), y);
        ctx.stroke();
      }
      ctx.restore();

      // floating sparks
      for (const s of sparks) {
        s.y -= s.v * 0.003;
        if (s.y < -0.05) { s.y = 1.05; s.x = Math.random(); }
        const x = s.x * w;
        const y = s.y * h;
        ctx.fillStyle = 'rgba(200,245,59,0.55)';
        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // scan beam
      const by = ((t * 35) % (h + 120)) - 60;
      const beam = ctx.createLinearGradient(0, by - 40, 0, by + 40);
      beam.addColorStop(0, 'rgba(110,200,255,0)');
      beam.addColorStop(0.5, 'rgba(110,200,255,0.05)');
      beam.addColorStop(1, 'rgba(110,200,255,0)');
      ctx.fillStyle = beam;
      ctx.fillRect(0, by - 40, w, 80);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
